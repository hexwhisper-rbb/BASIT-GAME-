<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASIT GAME - Endless Runner</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #171717;
    color: white;
    font-family: Arial, sans-serif;
    padding: 15px;
}

.container {
    max-width: 650px;
    margin: 20px auto;
    background: #252525;
    border: 3px solid #e5a323;
    border-radius: 12px;
    padding: 15px;
}

.logo {
    text-align: center;
    color: #ffbd36;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 20px;
}

.scoreboard {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
    color: #ffbd36;
    font-weight: bold;
}

canvas {
    display: block;
    width: 100%;
    background: #a8d9ed;
    border: 3px solid #444;
    border-radius: 7px;
    touch-action: manipulation;
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: none;
    padding: 15px;
    border-radius: 7px;
    background: #e5a323;
    color: #171717;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.controls button {
    flex: 1;
}

#jumpBtn {
    background: #ffbd36;
}

#startBtn {
    width: 100%;
    margin-top: 15px;
}

.instructions {
    text-align: center;
    color: #bbb;
    font-size: 13px;
    line-height: 1.7;
    margin-top: 18px;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 11px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">BASIT GAME</div>
    <div class="subtitle">THE ENDLESS RUNNER</div>

    <div class="scoreboard">
        <span>SCORE: <span id="score">0</span></span>
        <span>COINS: <span id="coins">0</span></span>
        <span>BEST: <span id="best">0</span></span>
    </div>

    <canvas id="game" width="800" height="360"></canvas>

    <button id="startBtn" onclick="startGame()">START GAME</button>

    <div class="controls">
        <button id="jumpBtn" onclick="jump()">⬆ JUMP</button>
        <button onclick="restartGame()">↻ RESTART</button>
    </div>

    <div class="instructions">
        TAP JUMP TO AVOID OBSTACLES.<br>
        COLLECT COINS AND BEAT YOUR HIGH SCORE!<br>
        You can also press SPACE on a keyboard.
    </div>

    <div class="footer">
        © 2026 BASIT GAME
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const bestText = document.getElementById("best");
const startBtn = document.getElementById("startBtn");

let gameRunning = false;
let gameOver = false;

let score = 0;
let coins = 0;
let best = 0;

try {
    best = Number(localStorage.getItem("basitBest")) || 0;
} catch(e) {}

bestText.textContent = best;

const ground = 290;

const player = {
    x: 100,
    y: ground - 55,
    width: 42,
    height: 55,
    velocity: 0,
    jumping: false
};

let obstacles = [];
let treasures = [];

let speed = 6;
let obstacleTimer = 0;
let coinTimer = 0;
let lastTime = 0;
let animationId = null;

function drawBackground() {

    // Sky
    ctx.fillStyle = "#a8d9ed";
    ctx.fillRect(0, 0, 800, 360);

    // Sun
    ctx.fillStyle = "#ffcf53";
    ctx.beginPath();
    ctx.arc(690, 65, 35, 0, Math.PI * 2);
    ctx.fill();

    // Clouds
    ctx.fillStyle = "white";

    drawCloud(130, 65);
    drawCloud(390, 95);
    drawCloud(590, 130);

    // Distant hills
    ctx.fillStyle = "#78a66c";

    ctx.beginPath();
    ctx.moveTo(0, 255);
    ctx.quadraticCurveTo(200, 130, 400, 255);
    ctx.quadraticCurveTo(600, 150, 800, 250);
    ctx.lineTo(800, 360);
    ctx.lineTo(0, 360);
    ctx.fill();

    // Ground
    ctx.fillStyle = "#d5a35d";
    ctx.fillRect(0, ground, 800, 70);

    ctx.fillStyle = "#5d963f";
    ctx.fillRect(0, ground, 800, 9);

    // Ground markings
    ctx.fillStyle = "#9b6a32";

    for (let i = 0; i < 800; i += 70) {
        ctx.fillRect(i, 320, 30, 5);
    }
}

function drawCloud(x, y) {

    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 10, 23, 0, Math.PI * 2);
    ctx.arc(x + 43, y, 18, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlayer() {

    const x = player.x;
    const y = player.y;

    // Body
    ctx.fillStyle = "#e5a323";
    ctx.fillRect(x, y + 15, 42, 40);

    // Head
    ctx.fillStyle = "#f5bd80";
    ctx.fillRect(x + 5, y, 32, 27);

    // Hair
    ctx.fillStyle = "#252525";
    ctx.fillRect(x + 4, y, 34, 8);

    // Eye
    ctx.fillStyle = "#222";
    ctx.fillRect(x + 28, y + 10, 5, 5);

    // Legs
    ctx.fillStyle = "#263b65";

    if (!player.jumping && gameRunning) {
        let step = Math.floor(Date.now() / 100) % 2;

        if (step === 0) {
            ctx.fillRect(x + 5, y + 52, 12, 12);
            ctx.fillRect(x + 27, y + 48, 12, 16);
        } else {
            ctx.fillRect(x + 5, y + 48, 12, 16);
            ctx.fillRect(x + 27, y + 52, 12, 12);
        }
    } else {
        ctx.fillRect(x + 5, y + 52, 12, 12);
        ctx.fillRect(x + 27, y + 52, 12, 12);
    }
}

function drawObstacle(ob) {

    ctx.fillStyle = "#287b38";

    ctx.fillRect(ob.x, ob.y, ob.width, ob.height);

    ctx.fillRect(ob.x - 9, ob.y + 13, 10, 12);
    ctx.fillRect(ob.x + ob.width - 1, ob.y + 25, 10, 12);

    ctx.fillStyle = "#165326";
    ctx.fillRect(ob.x + 8, ob.y + 5, 5, 8);
}

function drawCoin(coin) {

    ctx.fillStyle = "#ffbd36";

    ctx.beginPath();
    ctx.arc(coin.x, coin.y, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#b77916";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "#fff3ae";
    ctx.font = "bold 14px Arial";
    ctx.fillText("$", coin.x - 4, coin.y + 5);
}

function jump() {

    if (!gameRunning || gameOver) return;

    if (!player.jumping) {

        player.velocity = -14;
        player.jumping = true;
    }
}

function startGame() {

    if (animationId) {
        cancelAnimationFrame(animationId);
    }

    score = 0;
    coins = 0;
    speed = 6;

    obstacles = [];
    treasures = [];

    player.y = ground - player.height;
    player.velocity = 0;
    player.jumping = false;

    obstacleTimer = 0;
    coinTimer = 0;

    gameOver = false;
    gameRunning = true;

    scoreText.textContent = 0;
    coinsText.textContent = 0;

    startBtn.textContent = "GAME RUNNING...";

    lastTime = 0;
    animationId = requestAnimationFrame(gameLoop);
}

function restartGame() {
    startGame();
}

function createObstacle() {

    obstacles.push({
        x: 820,
        y: ground - 45,
        width: 32,
        height: 45
    });
}

function createCoin() {

    treasures.push({
        x: 820,
        y: ground - 85 - Math.random() * 35,
        radius: 12
    });
}

function update(delta) {

    const dt = delta / 16.67;

    score += dt * 0.1;

    speed = Math.min(13, 6 + score / 120);

    // Player gravity
    player.y += player.velocity * dt;
    player.velocity += 0.7 * dt;

    if (player.y >= ground - player.height) {

        player.y = ground - player.height;
        player.velocity = 0;
        player.jumping = false;
    }

    // Spawn obstacles
    obstacleTimer += delta;

    if (obstacleTimer > Math.max(750, 1500 - speed * 45)) {
        createObstacle();
        obstacleTimer = 0;
    }

    // Spawn coins
    coinTimer += delta;

    if (coinTimer > 1400) {
        createCoin();
        coinTimer = 0;
    }

    // Move obstacles
    obstacles.forEach(ob => {
        ob.x -= speed * dt;
    });

    obstacles = obstacles.filter(ob => ob.x > -60);

    // Move coins
    treasures.forEach(coin => {
        coin.x -= speed * dt;
    });

    treasures = treasures.filter(coin => coin.x > -30);

    // Obstacle collision
    obstacles.forEach(ob => {

        if (
            player.x + player.width - 8 > ob.x &&
            player.x + 8 < ob.x + ob.width &&
            player.y + player.height - 5 > ob.y
        ) {
            endGame();
        }
    });

    // Coin collection
    treasures = treasures.filter(coin => {

        let dx = player.x + 21 - coin.x;
        let dy = player.y + 25 - coin.y;

        if (Math.sqrt(dx * dx + dy * dy) < 30) {

            coins++;
            return false;
        }

        return true;
    });

    scoreText.textContent = Math.floor(score);
    coinsText.textContent = coins;
}

function draw() {

    drawBackground();

    treasures.forEach(drawCoin);
    obstacles.forEach(drawObstacle);

    drawPlayer();

    if (!gameRunning && !gameOver) {

        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, 800, 360);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 38px Arial";
        ctx.fillText("BASIT GAME", 400, 155);

        ctx.font = "20px Arial";
        ctx.fillText("Press START GAME to play", 400, 200);
        ctx.textAlign = "left";
    }
}

function gameLoop(timestamp) {

    if (!gameRunning) return;

    let delta = lastTime ? Math.min(timestamp - lastTime, 40) : 16.67;
    lastTime = timestamp;

    update(delta);
    draw();

    if (gameRunning) {
        animationId = requestAnimationFrame(gameLoop);
    }
}

function endGame() {

    gameRunning = false;
    gameOver = true;

    let finalScore = Math.floor(score);

    if (finalScore > best) {

        best = finalScore;

        try {
            localStorage.setItem("basitBest", best);
        } catch(e) {}
    }

    bestText.textContent = best;

    draw();

    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, 800, 360);

    ctx.textAlign = "center";

    ctx.fillStyle = "#ffbd36";
    ctx.font = "bold 45px Arial";
    ctx.fillText("GAME OVER!", 400, 140);

    ctx.fillStyle = "white";
    ctx.font = "25px Arial";
    ctx.fillText("Score: " + finalScore, 400, 195);

    ctx.font = "20px Arial";
    ctx.fillText("Coins collected: " + coins, 400, 235);

    ctx.font = "17px Arial";
    ctx.fillText("Press RESTART to play again", 400, 280);

    ctx.textAlign = "left";

    startBtn.textContent = "PLAY AGAIN";
}

// Keyboard controls
document.addEventListener("keydown", function(event) {

    if (event.code === "Space" || event.code === "ArrowUp") {

        event.preventDefault();
        jump();
    }
});

// Touch controls
canvas.addEventListener("pointerdown", function() {
    jump();
});

// Initial screen
draw();

</script>

</body>
</html>
